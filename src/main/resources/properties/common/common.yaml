# Common Configuration

# Listener Configuration 
https:
  host: "0.0.0.0"
  readTimeout: "30000"
  port: "8082"
  private:
    port: "8092"
 
# Scheduler Max Concurrency
maxConcurrency: "1"

# Response Timeout
response:
  timeout: "300000"
  
# Reconnection
reconnection:
  frequency: "5000"
  attempts: "6"
  
# Scheduler(s) Cron  
cron:
  daily: "0 0 0 ? * MON,TUE,WED,THU,FRI *"
  monthly: "0 0 1 ? 1-12 * *"
  
# Debug Logs Packages
debugPackages:
  sf: "org.mule.extension.salesforce"